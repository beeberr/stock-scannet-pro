name: Build and test
on:
  push:
    branches: [main, stock-scanner-connection-check]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test:paper
      - run: npm run test:market
      - run: npm run test:signal
      - run: npm run test:massive
      - run: npm run test:universe
      - run: npm run test:engines
      - run: npm run test:macro
      - run: npm run build
