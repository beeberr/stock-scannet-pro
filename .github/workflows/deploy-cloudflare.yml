name: Deploy Stock Scanner to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-scannet-pro-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: |
          npm run test:paper
          npm run test:market
          npm run test:signal
          npm run test:massive
          npm run test:universe
          npm run test:engines
          npm run test:macro

      - name: Build application
        run: npm run build

      - name: Validate Cloudflare credentials safely
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN ?? "";
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID ?? "";

          // Report only safe metadata; never print the token or authorization header.
          console.log(`Cloudflare token diagnostics: present=${Boolean(token)}, length=${token.length}, containsWhitespace=${/\s/.test(token)}, containsQuotes=${/["']/.test(token)}, containsNonAscii=${/[^\x20-\x7E]/.test(token)}, startsWithBearer=${/^Bearer\s/i.test(token)}.`);

          if (!token) {
            console.error("Cloudflare authentication check failed: CLOUDFLARE_API_TOKEN is missing or empty.");
            process.exit(1);
          }
          if (token !== token.trim() || /[\r\n]/.test(token)) {
            console.error("Cloudflare authentication check failed: the token contains leading/trailing whitespace or a line break. Save the token value only, without extra spaces or lines.");
            process.exit(1);
          }
          if (/^Bearer\s/i.test(token)) {
            console.error("Cloudflare authentication check failed: the secret appears to include the 'Bearer ' prefix. Save only the token value.");
            process.exit(1);
          }
          if (!/^[a-f0-9]{32}$/i.test(accountId)) {
            console.error("Cloudflare account check failed: CLOUDFLARE_ACCOUNT_ID is missing or is not a 32-character hexadecimal Cloudflare Account ID.");
            process.exit(1);
          }

          let response;
          try {
            response = await fetch("https://api.cloudflare.com/client/v4/user/tokens/verify", {
              method: "GET",
              headers: { Authorization: `Bearer ${token}`, Accept: "application/json" },
              signal: AbortSignal.timeout(15000)
            });
          } catch (error) {
            console.error("Cloudflare authentication check could not reach Cloudflare:", error?.name ?? "network error");
            process.exit(1);
          }

          let payload;
          try { payload = await response.json(); } catch { payload = null; }
          const tokenStatus = payload?.result?.status ?? "unknown";
          if (!response.ok || payload?.success !== true || tokenStatus !== "active") {
            console.error(`Cloudflare rejected the token. HTTP ${response.status}; API success: ${String(payload?.success)}; token status: ${tokenStatus}.`);
            for (const item of payload?.errors ?? []) {
              console.error(`Cloudflare error ${item.code ?? "unknown"}: ${item.message ?? "No message"}`);
              for (const nested of item.error_chain ?? []) {
                console.error(`Cloudflare detail ${nested.code ?? "unknown"}: ${nested.message ?? "No message"}`);
              }
            }
            console.error("The token value was not printed. Check that the GitHub secret contains the current Cloudflare API token.");
            process.exit(1);
          }
          console.log("Cloudflare token verified successfully; token status is active. Secret value was not printed.");
          console.log("Cloudflare Account ID format check passed.");
          NODE

      - name: Deploy Worker and static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.158.0"
          command: deploy --config wrangler.jsonc

      - name: Sync optional Massive Futures API secret
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$MASSIVE_API_KEY" ]; then
            echo "MASSIVE_API_KEY is not configured in GitHub; the app will safely show commodities as unavailable."
          else
            printf '%s' "$MASSIVE_API_KEY" | npx wrangler secret put MASSIVE_API_KEY --config wrangler.jsonc
            echo "Massive Futures API secret synced to the Worker; secret value was not printed."
          fi

      - name: Sync optional market data provider secrets
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for name in TWELVE_DATA_API_KEY FINNHUB_API_KEY FMP_API_KEY EODHD_API_KEY ALPHA_VANTAGE_API_KEY SEC_USER_AGENT; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" --config wrangler.jsonc
              echo "$name synced to Cloudflare Worker; value not printed."
            else
              echo "$name is not configured in GitHub; related engine will report provider unavailable."
            fi
          done

      - name: Check deployed website
        run: |
          node --input-type=module <<'NODE'
          const url = "https://stock-scannet-pro.china2sell.workers.dev/";
          let lastStatus = "no response";
          for (let attempt = 1; attempt <= 10; attempt++) {
            try {
              const response = await fetch(url, { redirect: "follow", signal: AbortSignal.timeout(10000) });
              lastStatus = String(response.status);
              if (response.ok) {
                console.log(`Website smoke test passed: HTTP ${response.status}.`);
                process.exit(0);
              }
            } catch (error) {
              lastStatus = error?.name ?? "network error";
            }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          console.error(`Website smoke test failed after 10 attempts. Last result: ${lastStatus}.`);
          process.exit(1);
          NODE

      - name: Verify deployed API endpoints
        env:
          BASE_URL: https://stock-scannet-pro.china2sell.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.BASE_URL;
          async function getJson(path) {
            const response = await fetch(new URL(path, base), {
              headers: { Accept: "application/json" },
              signal: AbortSignal.timeout(20000)
            });
            let body;
            try { body = await response.json(); }
            catch { throw new Error(`${path}: response was not valid JSON (HTTP ${response.status})`); }
            if (!response.ok) {
              throw new Error(`${path}: HTTP ${response.status}: ${body?.error ?? body?.message ?? "API request failed"}`);
            }
            return body;
          }

          const health = await getJson("/api/health");
          if (health.status !== "ok" || health.assets !== "bound") {
            throw new Error("/api/health: Worker or static assets are not healthy.");
          }
          console.log("PASS /api/health: Worker and static assets are available.");

          const macro = await getJson("/api/macro");
          const macroKeys = ["us_10y", "usd_broad", "crude_inventory", "wti_spot"];
          if (!macro.series || macroKeys.some(key => !macro.series[key] || macro.series[key].key !== key || !macro.series[key].status)) {
            throw new Error("/api/macro: one or more independent macro series are missing or malformed.");
          }
          if (macro.total !== 4 || typeof macro.available !== "number") {
            throw new Error("/api/macro: availability summary is malformed.");
          }
          console.log(`PASS /api/macro: all four macro series returned independently; ${macro.available}/4 currently available.`);

          const value = await getJson("/api/value");
          if (value.engine !== "value" || !["READY", "UNAVAILABLE"].includes(value.status) || !value.provider) {
            throw new Error("/api/value: provider status response is malformed.");
          }
          console.log(`PASS /api/value: FMP/EODHD endpoint responds with explicit status (${value.status}).`);

          const indices = await getJson("/api/indices");
          if (indices.engine !== "indices-sectors" || !["READY", "UNAVAILABLE"].includes(indices.status) || !indices.provider) {
            throw new Error("/api/indices: provider status response is malformed.");
          }
          console.log(`PASS /api/indices: FMP indices/sectors endpoint responds with explicit status (${indices.status}).`);

          const news = await getJson("/api/news");
          if (news.engine !== "news-events" || !["READY", "UNAVAILABLE"].includes(news.status) || !Array.isArray(news.news) || !Array.isArray(news.earnings)) {
            throw new Error("/api/news: Finnhub news/events response is malformed.");
          }
          console.log(`PASS /api/news: Finnhub endpoint responds with explicit status (${news.status}).`);
          if (news.errors) {
            for (const [feed, error] of Object.entries(news.errors)) {
              if (error) console.log(`DIAGNOSTIC /api/news ${feed}: ${String(error).slice(0, 300)}`);
            }
          }
          console.log(`DIAGNOSTIC /api/news counts: news=${news.news.length}, earnings=${news.earnings.length}.`);

          const disclosures = await getJson("/api/disclosures");
          if (disclosures.engine !== "public-disclosures" || !["READY", "UNAVAILABLE"].includes(disclosures.status) || !disclosures.provider) {
            throw new Error("/api/disclosures: SEC/Finnhub response is malformed.");
          }
          console.log(`PASS /api/disclosures: official/fallback filings endpoint responds with explicit status (${disclosures.status}).`);
          if (disclosures.error) console.log(`DIAGNOSTIC /api/disclosures: ${String(disclosures.error).slice(0, 300)}`);
          if (disclosures.data && typeof disclosures.data === "object") {
            for (const [symbol, row] of Object.entries(disclosures.data)) {
              console.log(`DIAGNOSTIC /api/disclosures ${symbol}: status=${row.status ?? "unknown"}${row.error ? `; ${String(row.error).slice(0, 200)}` : ""}; filings=${Array.isArray(row.filings) ? row.filings.length : 0}.`);
            }
          }

          const universe = await getJson("/api/universe");
          if (universe.configuredCount !== 45 || universe.maximum !== 50 || universe.dynamicSlots !== 5 || !Array.isArray(universe.assets) || universe.assets.length !== 45) {
            throw new Error("/api/universe: asset registry does not match the 45 configured + 5 reserved hard cap.");
          }
          if (new Set(universe.assets.map(asset => asset.symbol)).size !== universe.assets.length) {
            throw new Error("/api/universe: duplicate asset symbols detected.");
          }
          console.log("PASS /api/universe: 45 configured assets, five reserved slots, strict maximum 50.");

          for (const provider of ["massiveFutures", "twelveData"]) {
            if (health.providers?.[provider] !== "configured") {
              throw new Error(`/api/health: ${provider} key is not configured in the Cloudflare Worker.`);
            }
          }
          console.log("PASS /api/health: Massive Futures and Twelve Data credentials are configured.");

          const quotes = await getJson("/api/quotes");
          const requiredSymbols = ["AAPL", "MSFT", "NVDA", "XLE"];
          for (const symbol of requiredSymbols) {
            const quote = quotes.data?.[symbol];
            if (!quote || quote.symbol !== symbol || quote.close === undefined || quote.close === null || quote.status === "error") {
              throw new Error(`/api/quotes: missing or invalid quote for ${symbol}.`);
            }
          }
          if (!["Twelve Data", "Alpha Vantage", "Twelve Data + Alpha Vantage"].includes(quotes.source)) {
            throw new Error("/api/quotes: unexpected data source.");
          }
          console.log("PASS /api/quotes: valid quotes returned for AAPL, MSFT, NVDA and XLE from Twelve Data or its Alpha Vantage fallback.");

          const commodities = await getJson("/api/commodities");
          if (commodities.providerConfigured !== true) {
            throw new Error("/api/commodities: Massive Futures provider is not configured.");
          }
          for (const key of ["GC", "CL"]) {
            const quote = commodities.data?.[key];
            if (!quote || quote.available !== true || !(quote.close || quote.price)) {
              throw new Error(`/api/commodities: ${key} (gold/oil) is unavailable: ${quote?.error ?? "no valid price returned"}`);
            }
          }
          console.log("PASS /api/commodities: valid gold (GC) and WTI oil (CL) prices returned from Massive Futures.");
          console.log("API integration smoke tests passed. No API keys or quote payloads were printed.");
          NODE

      - name: Install Chromium for browser verification
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Verify deployed UI in a real browser
        env:
          BASE_URL: https://stock-scannet-pro.china2sell.workers.dev
        run: node scripts/test-browser.mjs
