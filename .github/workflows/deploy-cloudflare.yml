name: Deploy Stock Scanner to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-scannet-pro-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: |
          npm run test:paper
          npm run test:market
          npm run test:signal
          npm run test:massive
          npm run test:universe
          npm run test:engines
          npm run test:macro

      - name: Build application
        run: npm run build

      - name: Validate Cloudflare credentials safely
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN ?? "";
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID ?? "";

          // Report only safe metadata; never print the token or authorization header.
          console.log(`Cloudflare token diagnostics: present=${Boolean(token)}, length=${token.length}, containsWhitespace=${/\s/.test(token)}, containsQuotes=${/["']/.test(token)}, containsNonAscii=${/[^\x20-\x7E]/.test(token)}, startsWithBearer=${/^Bearer\s/i.test(token)}.`);

          if (!token) {
            console.error("Cloudflare authentication check failed: CLOUDFLARE_API_TOKEN is missing or empty.");
            process.exit(1);
          }
          if (token !== token.trim() || /[\r\n]/.test(token)) {
            console.error("Cloudflare authentication check failed: the token contains leading/trailing whitespace or a line break. Save the token value only, without extra spaces or lines.");
            process.exit(1);
          }
          if (/^Bearer\s/i.test(token)) {
            console.error("Cloudflare authentication check failed: the secret appears to include the 'Bearer ' prefix. Save only the token value.");
            process.exit(1);
          }
          if (!/^[a-f0-9]{32}$/i.test(accountId)) {
            console.error("Cloudflare account check failed: CLOUDFLARE_ACCOUNT_ID is missing or is not a 32-character hexadecimal Cloudflare Account ID.");
            process.exit(1);
          }

          let response;
          try {
            response = await fetch("https://api.cloudflare.com/client/v4/user/tokens/verify", {
              method: "GET",
              headers: { Authorization: `Bearer ${token}`, Accept: "application/json" },
              signal: AbortSignal.timeout(15000)
            });
          } catch (error) {
            console.error("Cloudflare authentication check could not reach Cloudflare:", error?.name ?? "network error");
            process.exit(1);
          }

          let payload;
          try { payload = await response.json(); } catch { payload = null; }
          const tokenStatus = payload?.result?.status ?? "unknown";
          if (!response.ok || payload?.success !== true || tokenStatus !== "active") {
            console.error(`Cloudflare rejected the token. HTTP ${response.status}; API success: ${String(payload?.success)}; token status: ${tokenStatus}.`);
            for (const item of payload?.errors ?? []) {
              console.error(`Cloudflare error ${item.code ?? "unknown"}: ${item.message ?? "No message"}`);
              for (const nested of item.error_chain ?? []) {
                console.error(`Cloudflare detail ${nested.code ?? "unknown"}: ${nested.message ?? "No message"}`);
              }
            }
            console.error("The token value was not printed. Check that the GitHub secret contains the current Cloudflare API token.");
            process.exit(1);
          }
          console.log("Cloudflare token verified successfully; token status is active. Secret value was not printed.");
          console.log("Cloudflare Account ID format check passed.");
          NODE

      - name: Deploy Worker and static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.158.0"
          command: deploy --config wrangler.jsonc

      - name: Sync all market data provider secrets to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          EULERPOOL_API_KEY: ${{ secrets.EULERPOOL_API_KEY }}
          MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          set -euo pipefail
          umask 077
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          node --input-type=module <<'NODE' > "$secret_file"
          const names = [
            "MASSIVE_API_KEY",
            "TWELVE_DATA_API_KEY",
            "FINNHUB_API_KEY",
            "FMP_API_KEY",
            "EODHD_API_KEY",
            "ALPHA_VANTAGE_API_KEY",
            "EULERPOOL_API_KEY",
            "MARKETSTACK_API_KEY",
            "SEC_USER_AGENT"
          ];
          const payload = {};
          const missing = [];
          for (const name of names) {
            const value = process.env[name] ?? "";
            if (!value) {
              missing.push(name);
              continue;
            }
            if (value !== value.trim() || /[\\r\\n]/.test(value)) {
              // Skip only the malformed key. Other valid provider credentials can still sync.
              // Existing Cloudflare values are left untouched because omitted names are not sent.
              console.error(name + " has surrounding whitespace or a line break; skipped without changing its Cloudflare value.");
              missing.push(name + " (invalid formatting)");
              continue;
            }
            payload[name] = value;
          }
          if (Object.keys(payload).length === 0) {
            console.error("No provider secrets were supplied; existing Cloudflare values are left untouched and sync is skipped.");
            process.exit(0);
          }
          console.error("Provider secrets present: " + Object.keys(payload).join(", "));
          if (missing.length) console.error("Provider secrets absent from GitHub (existing Cloudflare values, if any, are left unchanged): " + missing.join(", "));
          process.stdout.write(JSON.stringify(payload));
          NODE
          if [ -s "$secret_file" ]; then
            npx wrangler secret bulk --config wrangler.jsonc < "$secret_file"
            echo "Configured market-data provider secrets synced to Cloudflare. Secret values were not printed."
          else
            echo "No provider secrets to sync; skipped without changing Cloudflare secrets."
          fi

      - name: Check deployed website
        run: |
          node --input-type=module <<'NODE'
          const url = "https://stock-scannet-pro.china2sell.workers.dev/";
          let lastStatus = "no response";
          for (let attempt = 1; attempt <= 10; attempt++) {
            try {
              const response = await fetch(url, { redirect: "follow", signal: AbortSignal.timeout(10000) });
              lastStatus = String(response.status);
              if (response.ok) {
                console.log(`Website smoke test passed: HTTP ${response.status}.`);
                process.exit(0);
              }
            } catch (error) {
              lastStatus = error?.name ?? "network error";
            }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          console.error(`Website smoke test failed after 10 attempts. Last result: ${lastStatus}.`);
          process.exit(1);
          NODE

      - name: Verify deployed API endpoints
        env:
          BASE_URL: https://stock-scannet-pro.china2sell.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.BASE_URL;
          async function getJson(path) {
            const response = await fetch(new URL(path, base), {
              headers: { Accept: "application/json" },
              signal: AbortSignal.timeout(20000)
            });
            let body;
            try { body = await response.json(); }
            catch { throw new Error(`${path}: response was not valid JSON (HTTP ${response.status})`); }
            if (!response.ok) {
              throw new Error(`${path}: HTTP ${response.status}: ${body?.error ?? body?.message ?? "API request failed"}`);
            }
            return body;
          }

          const health = await getJson("/api/health");
          if (health.status !== "ok" || health.assets !== "bound") {
            throw new Error("/api/health: Worker or static assets are not healthy.");
          }
          console.log("PASS /api/health: Worker and static assets are available.");

          const macro = await getJson("/api/macro");
          const macroKeys = ["us_10y", "usd_broad", "crude_inventory", "wti_spot"];
          if (!macro.series || macroKeys.some(key => !macro.series[key] || macro.series[key].key !== key || !macro.series[key].status)) {
            throw new Error("/api/macro: one or more independent macro series are missing or malformed.");
          }
          if (macro.total !== 4 || typeof macro.available !== "number") {
            throw new Error("/api/macro: availability summary is malformed.");
          }
          console.log(`PASS /api/macro: all four macro series returned independently; ${macro.available}/4 currently available.`);

          const value = await getJson("/api/value");
          if (value.engine !== "value" || !["READY", "UNAVAILABLE"].includes(value.status) || !value.provider) {
            throw new Error("/api/value: provider status response is malformed.");
          }
          console.log(`PASS /api/value: ${value.provider} endpoint responds with explicit status (${value.status}).`);

          const indices = await getJson("/api/indices");
          if (indices.engine !== "indices-sectors" || !["READY", "PARTIAL", "UNAVAILABLE"].includes(indices.status) || !indices.provider || !indices.data || typeof indices.available !== "number" || indices.total !== 11) {
            throw new Error("/api/indices: provider status response is malformed.");
          }
          const indexSources = [...new Set(Object.values(indices.data).map(row => row?.source).filter(Boolean))];
          console.log(`PASS /api/indices: ${indices.provider} endpoint responds with explicit status (${indices.status}); ${indices.available}/${indices.total} ETF proxies available; row sources: ${indexSources.join(", ") || "not reported"}.`);

          const news = await getJson("/api/news");
          if (news.engine !== "news-events" || !["READY", "UNAVAILABLE"].includes(news.status) || !Array.isArray(news.news) || !Array.isArray(news.earnings)) {
            throw new Error("/api/news: Finnhub news/events response is malformed.");
          }
          console.log(`PASS /api/news: Finnhub endpoint responds with explicit status (${news.status}).`);

          const disclosures = await getJson("/api/disclosures");
          if (disclosures.engine !== "public-disclosures" || !["READY", "UNAVAILABLE"].includes(disclosures.status) || !disclosures.provider) {
            throw new Error("/api/disclosures: SEC/Finnhub response is malformed.");
          }
          console.log(`PASS /api/disclosures: official/fallback filings endpoint responds with explicit status (${disclosures.status}).`);

          const universe = await getJson("/api/universe");
          if (universe.configuredCount !== 45 || universe.maximum !== 50 || universe.dynamicSlots !== 5 || !Array.isArray(universe.assets) || universe.assets.length !== 45) {
            throw new Error("/api/universe: asset registry does not match the 45 configured + 5 reserved hard cap.");
          }
          if (new Set(universe.assets.map(asset => asset.symbol)).size !== universe.assets.length) {
            throw new Error("/api/universe: duplicate asset symbols detected.");
          }
          console.log("PASS /api/universe: 45 configured assets, five reserved slots, strict maximum 50.");

          if (health.providers?.massiveFutures !== "configured") {
            throw new Error("/api/health: MASSIVE_API_KEY is not configured in the Cloudflare Worker.");
          }
          console.log("PASS /api/health: Massive Futures credential is configured.");

          const optionalProviderNames = ["finnhub", "fmp", "eodhd", "alphaVantage", "eulerpool", "marketstack"];
          const missingOptionalProviders = optionalProviderNames.filter(name => health.providers?.[name] !== "configured");
          if (missingOptionalProviders.length) {
            console.warn("WARN /api/health: optional provider credentials are not configured: " + missingOptionalProviders.join(", ") + ". Related research engines remain explicitly unavailable until configured.");
          } else {
            console.log("PASS /api/health: all optional provider credentials are configured.");
          }
          console.log("PASS /api/health: required Twelve Data and Massive credentials are verified separately by quote, engine and commodity smoke tests.");

          const quotes = await getJson("/api/quotes");
          if (quotes.available !== 4 || quotes.total !== 4 || !quotes.data ||
              ["AAPL", "MSFT", "NVDA", "XLE"].some(symbol => {
                const quote = quotes.data[symbol];
                return !quote || quote.status === "UNAVAILABLE" || quote.close === undefined || quote.close === null;
              })) {
            throw new Error("/api/quotes: expected four valid quotes; received " + String(quotes.available) + "/" + String(quotes.total) + ".");
          }
          console.log("PASS /api/quotes: four valid market quotes returned. Provider: " + String(quotes.source) + ".");

          const engines = await getJson("/api/engines?symbols=AAPL,MSFT,NVDA,XLE");
          const engineSymbols = ["AAPL", "MSFT", "NVDA", "XLE"];
          if (engines.source !== "Twelve Data" ||
              !Array.isArray(engines.activeEngines) ||
              !engines.activeEngines.includes("technical") ||
              !engines.activeEngines.includes("momentum") ||
              !engines.data ||
              engineSymbols.some(symbol => {
                const row = engines.data[symbol];
                return !row || !Number.isFinite(Number(row.lastPrice)) || Number(row.lastPrice) <= 0 ||
                  !Number.isFinite(Number(row.candles)) || Number(row.candles) < 2 ||
                  !row.technical || !row.momentum;
              })) {
            throw new Error("/api/engines: technical/momentum engine payload is missing or invalid.");
          }
          console.log("PASS /api/engines: technical and momentum returned valid OHLCV analysis for all four symbols; candles and as-of timestamps included.");


          const commodities = await getJson("/api/commodities");
          if (commodities.providerConfigured !== true) {
            throw new Error("/api/commodities: Massive Futures provider is not configured.");
          }
          if (!["READY", "DEGRADED", "UNAVAILABLE"].includes(commodities.status) ||
              !commodities.data || !["GC", "SI", "HG", "CL"].every(key => commodities.data[key])) {
            throw new Error("/api/commodities: provider response is missing explicit status or expected commodity records.");
          }
          const gold = commodities.data.GC;
          const oil = commodities.data.CL;
          const validPrice = quote => quote?.available === true && Number.isFinite(Number(quote.close ?? quote.price)) && Number(quote.close ?? quote.price) > 0;
          const availableCommodities = [gold, commodities.data.SI, commodities.data.HG, oil].filter(validPrice).length;
          if (commodities.status === "READY" && (!validPrice(gold) || !validPrice(oil) || availableCommodities !== 4)) {
            throw new Error("/api/commodities: READY status requires all four commodity prices, including gold and WTI.");
          }
          if (commodities.status === "DEGRADED") {
            if (!commodities.stale || availableCommodities === 0) {
              throw new Error("/api/commodities: DEGRADED status must explicitly identify stale cached data.");
            }
            console.warn("WARN /api/commodities: Massive is rate-limited or unavailable; explicitly marked cached data is being served.");
          } else if (commodities.status === "PARTIAL") {
            if (availableCommodities === 0) throw new Error("/api/commodities: PARTIAL status has no valid commodity prices.");
            console.warn(`WARN /api/commodities: Massive returned partial coverage (${availableCommodities}/4); unavailable commodities remain explicitly marked.`);
          } else if (commodities.status === "UNAVAILABLE") {
            console.warn("WARN /api/commodities: Massive is configured but currently has no valid cached/current commodity prices. Deployment can proceed; the commodity engine remains unavailable.");
          } else {
            console.log("PASS /api/commodities: all four commodity prices returned from Massive Futures.");
          }
          console.log("API integration smoke tests passed. Provider outages are reported as degraded data, not deployment failures.");
          NODE

      - name: Install Chromium for browser verification
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Verify deployed UI in a real browser
        env:
          BASE_URL: https://stock-scannet-pro.china2sell.workers.dev
        run: node scripts/test-browser.mjs
