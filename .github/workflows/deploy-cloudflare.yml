name: Deploy Stock Scanner to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-scannet-pro-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: |
          npm run test:paper
          npm run test:market
          npm run test:signal

      - name: Build application
        run: npm run build

      - name: Validate Cloudflare credentials safely
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN ?? "";
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID ?? "";

          if (!token) {
            console.error("Cloudflare authentication check failed: CLOUDFLARE_API_TOKEN is missing or empty.");
            process.exit(1);
          }
          if (token !== token.trim() || /[\r\n]/.test(token)) {
            console.error("Cloudflare authentication check failed: the token contains leading/trailing whitespace or a line break. Save the token value only, without extra spaces or lines.");
            process.exit(1);
          }
          if (/^Bearer\s/i.test(token)) {
            console.error("Cloudflare authentication check failed: the secret appears to include the 'Bearer ' prefix. Save only the token value.");
            process.exit(1);
          }
          if (!/^[a-f0-9]{32}$/i.test(accountId)) {
            console.error("Cloudflare account check failed: CLOUDFLARE_ACCOUNT_ID is missing or is not a 32-character hexadecimal Cloudflare Account ID.");
            process.exit(1);
          }

          let response;
          try {
            response = await fetch("https://api.cloudflare.com/client/v4/user/tokens/verify", {
              method: "GET",
              headers: { Authorization: `Bearer ${token}`, Accept: "application/json" },
              signal: AbortSignal.timeout(15000)
            });
          } catch (error) {
            console.error("Cloudflare authentication check could not reach Cloudflare:", error?.name ?? "network error");
            process.exit(1);
          }

          let payload;
          try { payload = await response.json(); } catch { payload = null; }
          const tokenStatus = payload?.result?.status ?? "unknown";
          if (!response.ok || payload?.success !== true || tokenStatus !== "active") {
            console.error(`Cloudflare rejected the token. HTTP ${response.status}; API success: ${String(payload?.success)}; token status: ${tokenStatus}.`);
            for (const item of payload?.errors ?? []) {
              console.error(`Cloudflare error ${item.code ?? "unknown"}: ${item.message ?? "No message"}`);
              for (const nested of item.error_chain ?? []) {
                console.error(`Cloudflare detail ${nested.code ?? "unknown"}: ${nested.message ?? "No message"}`);
              }
            }
            console.error("The token value was not printed. Check that the GitHub secret contains the current Cloudflare API token.");
            process.exit(1);
          }
          console.log("Cloudflare token verified successfully; token status is active. Secret value was not printed.");
          console.log("Cloudflare Account ID format check passed.");
          NODE

      - name: Deploy Worker and static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.158.0"
          command: deploy --config wrangler.jsonc

      - name: Check deployed website
        run: |
          node --input-type=module <<'NODE'
          const url = "https://stock-scannet-pro.china2sell.workers.dev/";
          let lastStatus = "no response";
          for (let attempt = 1; attempt <= 10; attempt++) {
            try {
              const response = await fetch(url, { redirect: "follow", signal: AbortSignal.timeout(10000) });
              lastStatus = String(response.status);
              if (response.ok) {
                console.log(`Website smoke test passed: HTTP ${response.status}.`);
                process.exit(0);
              }
            } catch (error) {
              lastStatus = error?.name ?? "network error";
            }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          console.error(`Website smoke test failed after 10 attempts. Last result: ${lastStatus}.`);
          process.exit(1);
          NODE

