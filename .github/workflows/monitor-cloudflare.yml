name: Monitor Stock Scanner availability

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-scannet-pro-availability-monitor
  cancel-in-progress: false

jobs:
  uptime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live site, all APIs, provider sources and data age
        env:
          BASE_URL: https://stock-scannet-pro.china2sell.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.BASE_URL;
          const failures = [];
          const timestampMs = value => {
            if (typeof value === "number" && Number.isFinite(value)) return value < 1e12 ? value * 1000 : value;
            const raw = String(value || "");
            const ms = Date.parse(/^\d{4}-\d{2}-\d{2}$/.test(raw) ? raw + "T00:00:00Z" : raw);
            return Number.isFinite(ms) ? ms : null;
          };
          const ageText = value => {
            const ms = timestampMs(value);
            if (ms === null) return "age n/a";
            const age = Math.max(0, Date.now() - ms);
            if (typeof value === "string" && /^\d{4}-\d{2}-\d{2}$/.test(value)) return "date-only " + value + " · " + (age / 86400000).toFixed(1) + " calendar days (time unavailable)";
            return "age " + (age / 3600000).toFixed(1) + "h";
          };
          const isoTime = value => {
            const ms = timestampMs(value);
            return ms === null ? "n/a" : new Date(ms).toISOString();
          };;
          async function get(path) {
            const start = Date.now();
            const response = await fetch(new URL(path, base), {
              headers: { Accept: "application/json" },
              signal: AbortSignal.timeout(20000),
              cache: "no-store"
            });
            const elapsed = Date.now() - start;
            let body = null;
            try { body = await response.json(); } catch {}
            console.log("HTTP " + response.status + " " + path + " · " + elapsed + "ms");
            if (!response.ok || !body || typeof body !== "object") {
              failures.push(path + " HTTP " + response.status + (body?.error ? ": " + body.error : ""));
              return null;
            }
            if (body.status && !["READY", "PARTIAL", "UNAVAILABLE", "DEGRADED"].includes(body.status) && path !== "/api/health") {
              failures.push(path + " returned an unknown status: " + body.status);
            }
            return body;
          }
          async function checkSite() {
            const response = await fetch(base + "/", { signal: AbortSignal.timeout(15000), redirect: "follow" });
            if (!response.ok) throw new Error("Homepage HTTP " + response.status);
            const html = await response.text();
            const js = html.match(/<script[^>]+src="([^"]+\.js[^"]*)"/i)?.[1];
            const css = html.match(/<link[^>]+href="([^"]+\.css[^"]*)"/i)?.[1];
            if (!js || !css) throw new Error("Homepage missing JS/CSS asset references");
            for (const asset of [js, css]) {
              const result = await fetch(new URL(asset, base), { signal: AbortSignal.timeout(12000) });
              if (!result.ok) throw new Error("Static asset HTTP " + result.status + ": " + asset);
            }
            console.log("SITE HTTP " + response.status + " · JS and CSS assets loaded.");
          }
          const list = rows => Object.entries(rows || {});
          try { await checkSite(); } catch (e) { failures.push("SITE " + (e?.message || e)); }

          const health = await get("/api/health");
          if (health) {
            console.log("HEALTH " + health.status + " · assets=" + health.assets + " · version=" + health.version);
            console.log("PROVIDER_BINDINGS " + JSON.stringify(health.providers || {}) + " · configured means non-empty secret binding only, not successful validation.");
          }

          const quotes = await get("/api/quotes");
          if (quotes) {
            console.log("QUOTES " + quotes.status + " · " + quotes.available + "/" + quotes.total + " · sources=" + quotes.source + " · fetchedAt=" + quotes.fetchedAt);
            for (const [symbol,row] of list(quotes.data)) console.log("  " + symbol + " " + (row.status || "READY") + " · " + (row.source || "unknown") + " · " + (row.datetime || "n/a") + " · " + ageText(row.datetime) + (row.error ? " · " + row.error : ""));
          }

          const engines = await get("/api/engines?symbols=AAPL,MSFT,NVDA,XLE");
          if (engines) {
            console.log("TECHNICAL " + engines.status + " · " + engines.available + "/" + engines.total + " complete · Twelve Data · stale=" + Boolean(engines.stale) + " · fetchedAt=" + engines.fetchedAt + (engines.staleReason ? " · staleReason=" + engines.staleReason : ""));
            const expectedTechnical = engines.stale === true && engines.available > 0 ? "PARTIAL" : engines.available === engines.total ? "READY" : engines.available > 0 ? "PARTIAL" : "UNAVAILABLE";
            if (engines.status !== expectedTechnical) failures.push("/api/engines aggregate status mismatch");
            for (const [symbol,row] of list(engines.data)) console.log("  " + symbol + " " + row.status + " · technical=" + row.technical?.status + " · momentum=" + row.momentum?.status + " · candles=" + (row.candles ?? 0) + " · " + (row.asOf || "n/a") + " · " + ageText(row.asOf) + (row.error ? " · " + row.error : ""));
          }

          const value = await get("/api/value");
          if (value) {
            console.log("VALUE " + value.status + " · " + value.available + "/" + value.total + " · provider route=" + value.provider + " · fetchedAt=" + value.fetchedAt);
            const valueRows = list(value.data);
            const valueAvailable = valueRows.filter(([,row]) => row.status === "READY").length;
            const valueComplete = valueRows.filter(([,row]) => row.status === "READY" && row.partial !== true).length;
            const expectedValueStatus = valueComplete === value.total ? "READY" : valueAvailable > 0 ? "PARTIAL" : "UNAVAILABLE";
            if (value.status !== expectedValueStatus || value.available !== valueAvailable) failures.push("/api/value aggregate status mismatch");
            for (const [symbol,row] of valueRows) {
              const asOf = row.asOf || row.latestFinancials?.date || "n/a";
              const asOfMs = timestampMs(asOf);
              const ageDays = asOfMs === null ? null : Math.floor(Math.max(0, Date.now() - asOfMs) / 86400000);
              const stale = ageDays === null || ageDays > 120;
              if (stale && row.status === "READY" && row.partial !== true) failures.push("/api/value " + symbol + " stale financial data not marked partial");
              console.log("  " + symbol + " " + row.status + " · source=" + (row.source || "unknown") + " · partial=" + Boolean(row.partial) + " · stale=" + stale + " · " + ageText(asOf) + (row.partialReason ? " · " + row.partialReason : "") + (row.error ? " · " + row.error : ""));
            }
          }

          const macro = await get("/api/macro");
          if (macro) {
            console.log("MACRO engine=" + macro.status + " · historical series=" + (macro.seriesStatus || "not reported") + " · " + macro.available + "/" + macro.total + " ready · " + macro.observed + " observed · bank forecasts not connected · sources=" + macro.source + " · fetchedAt=" + macro.fetchedAt);
            const expectedSeriesStatus = macro.available === macro.total ? "READY" : macro.observed > 0 ? "PARTIAL" : "UNAVAILABLE";
            const expectedEngineStatus = macro.observed > 0 ? "PARTIAL" : "UNAVAILABLE";
            if (macro.seriesStatus !== expectedSeriesStatus || macro.status !== expectedEngineStatus) failures.push("/api/macro engine/series coverage status mismatch");
            for (const [key,row] of list(macro.series)) console.log("  " + key + " " + row.status + " · " + (row.source || "FRED") + " · asOf=" + (row.asOf || "n/a") + " · " + ageText(row.asOf) + " · observations=" + (row.observations ?? 0) + (row.error ? " · " + row.error : ""));
          }

          const indices = await get("/api/indices");
          if (indices) {
            console.log("INDICES " + indices.status + " · " + indices.available + "/" + indices.total + " · providers=" + indices.provider + " · fetchedAt=" + indices.fetchedAt);
            const expectedIndices = indices.available === indices.total ? "READY" : indices.available > 0 ? "PARTIAL" : "UNAVAILABLE";
            if (indices.status !== expectedIndices) failures.push("/api/indices aggregate status mismatch");
            for (const [symbol,row] of list(indices.data)) console.log("  " + symbol + " " + row.status + " · " + (row.source || "unknown") + " · asOf=" + (row.asOf || "n/a") + " · " + ageText(row.asOf) + (row.error ? " · " + row.error : ""));
          }

          const commodities = await get("/api/commodities");
          if (commodities) {
            console.log("COMMODITIES " + commodities.status + " · " + commodities.available + "/" + commodities.total + " · provider=" + commodities.provider + " · stale=" + Boolean(commodities.stale) + " · fetchedAt=" + commodities.fetchedAt + " · lastAttemptAt=" + (commodities.lastAttemptAt || "n/a"));
            const expectedCommodities = commodities.stale && commodities.available > 0 ? "PARTIAL" : commodities.available === commodities.total ? "READY" : commodities.available > 0 ? "PARTIAL" : "UNAVAILABLE";
            if (commodities.status !== expectedCommodities) failures.push("/api/commodities aggregate status mismatch");
            for (const [symbol,row] of list(commodities.data)) console.log("  " + symbol + " " + (row.available ? "AVAILABLE" : "UNAVAILABLE") + " · " + (row.source || commodities.provider || "unknown") + " · contract=" + (row.contract || row.symbol || "n/a") + " · session=" + (row.sessionDate || row.datetime || "n/a") + " · " + ageText(row.sessionDate || row.datetime) + (row.delayHours ? " · delay=" + row.delayHours + "h" : "") + (row.error ? " · " + row.error : ""));
          }

          const news = await get("/api/news");
          if (news) {
            console.log("NEWS " + news.status + " · Finnhub · news=" + (news.news || []).length + " · earnings=" + (news.earnings || []).length + " · fetchedAt=" + news.fetchedAt);
            if (news.errors?.news) console.log("  news error: " + news.errors.news);
            if (news.errors?.earnings) console.log("  earnings error: " + news.errors.earnings);
            const latestNews = (news.news || []).map(x=>x.datetime || x.publishedAt).filter(Boolean).sort((a,b)=>timestampMs(a)-timestampMs(b)).at(-1);
            const nextEarnings = (news.earnings || []).map(x=>x.date).filter(Boolean).sort()[0];
            console.log("  latest news timestamp=" + isoTime(latestNews) + " · next earnings date=" + (nextEarnings || "n/a"));
          }

          const disclosures = await get("/api/disclosures");
          if (disclosures) {
            console.log("DISCLOSURES engine=" + disclosures.status + " · company filings=" + (disclosures.filingsStatus || "not reported") + " · provider=" + (disclosures.provider || "not reported") + " · " + (disclosures.available ?? "?") + "/" + (disclosures.total ?? "?") + " checked · STOCK Act coverage not connected · fetchedAt=" + disclosures.fetchedAt);
            const expectedFilings = disclosures.available === disclosures.total ? "READY" : disclosures.available > 0 ? "PARTIAL" : "UNAVAILABLE";
            const expectedDisclosureEngine = disclosures.available > 0 ? "PARTIAL" : "UNAVAILABLE";
            if (disclosures.filingsStatus !== expectedFilings || disclosures.status !== expectedDisclosureEngine) failures.push("/api/disclosures engine/filings coverage status mismatch");
            for (const [symbol,row] of list(disclosures.data)) {
              const filings = row.filings || [];
              const latest = filings.map(x=>x.filingDate || x.filedDate || x.acceptedDate || x.date || x.filing_date).filter(Boolean).map(String).sort().at(-1);
              console.log("  " + symbol + " " + row.status + " · source=" + (row.source || disclosures.provider || "unknown") + " · filings=" + filings.length + " · latest=" + (latest || "n/a") + (latest ? " · " + ageText(latest) : "") + (row.error ? " · " + row.error : ""));
            }
          }

          if (failures.length) {
            console.error("MONITOR FAILURES: " + failures.join(" | "));
            process.exit(1);
          }
          console.log("MONITOR PASS: live site, health, quotes, technical/momentum, value, macro, indices, commodities, news and disclosures checked.");
          NODE
