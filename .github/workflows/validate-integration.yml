name: Validate external engine integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [integrate-alphasift-dsa]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: |
          npm run test:paper
          npm run test:market
          npm run test:signal
          npm run test:massive
          npm run test:universe
          npm run test:engines
          npm run test:macro
      - run: npm run build
