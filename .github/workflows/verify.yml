name: Verify application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        run: npm run build
      - name: Test paper trading
        run: npm run test:paper
      - name: Test market analysis
        run: npm run test:market
      - name: Test signal engine
        run: npm run test:signal
      - name: Test opportunity discovery
        run: npm run test:opportunities
      - name: Test Massive Futures provider
        run: npm run test:massive
      - name: Test macro research
        run: npm run test:macro
