name: Validate Stock Scanner changes

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run regression tests
        run: |
          npm run test:paper
          npm run test:market
          npm run test:signal
          npm run test:opportunities
          npm run test:massive
          npm run test:universe
          npm run test:engines
          npm run test:macro

      - name: Build application
        run: npm run build
